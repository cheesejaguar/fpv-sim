name = "fpv-sim-rooms"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[vars]
# Pages allowed to open room WebSockets (comma-separated; "*." wildcards and "host:*" ports allowed)
ALLOWED_ORIGINS = "https://fpv-sim-gamma.vercel.app,https://*.vercel.app,http://localhost:*,http://127.0.0.1:*"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# v2: public room directory for the server browser
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]
