name = "fpv-sim-rooms"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[vars]
# Pages allowed to open room WebSockets and read the room list (comma-separated). An entry without
# "*" is an exact origin (any scheme: "app://fpv-sim" is the desktop build). In http(s) entries "*"
# stands for part of ONE host label, or for the port; a "*" that is a whole label or sits in the
# registrable domain ("https://*.vercel.app" would admit anyone's Vercel site) is refused.
# Production, this project's own Vercel previews (deployments are fpv-<hash>-<scope>, branches
# fpv-sim-git-<branch>-<scope>; Vercel shortens the project name in deployment URLs), and the
# desktop build.
ALLOWED_ORIGINS = "https://fpv-sim-gamma.vercel.app,https://fpv-*-cheesejaguar-2353s-projects.vercel.app,app://fpv-sim"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# v2: public room directory for the server browser
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

# v3: global lap leaderboards (SQLite tables)
[[migrations]]
tag = "v3"
new_sqlite_classes = ["Leaderboard"]

# ---- User maps (mapStore.ts): packages players publish, shown as "User map · not reviewed" ----
# MAP_INDEX: one SQLite Durable Object with the metadata, reports and upload quotas (migration v4).
# USER_MAPS: an R2 bucket with the packages (pkg/<id>.zip) and previews (prev/<id>.<ext>). Create it
# once before deploying:
#   npx wrangler r2 bucket create fpv-sim-user-maps
# Without these two bindings the relay still runs and /maps answers 503 (sharing disabled).
# Moderation (ADMIN_TOKEN, below):
#   curl -X DELETE -H "Authorization: Bearer <token>" https://<relay>/maps/u-<id>        remove for good
#   curl -X POST -H "Authorization: Bearer <token>" -d '{"status":"ok"}' https://<relay>/maps/u-<id>/status
#        (restore a map hidden after REPORT_HIDE reports; "hidden" hides one)
# A DENYLIST key "map:u-<id>" refuses a map like a removal. Uploads use the RATE_LIMITER key
# "up:<ip>" and reports "rp:<ip>"; each network may publish DAILY_UPLOADS new maps per day.
[[durable_objects.bindings]]
name = "MAP_INDEX"
class_name = "MapIndex"

[[r2_buckets]]
binding = "USER_MAPS"
bucket_name = "fpv-sim-user-maps"

# v4: user map index (SQLite tables)
[[migrations]]
tag = "v4"
new_sqlite_classes = ["MapIndex"]

# ---- Optional abuse limits: each one is used only if its binding exists (none is required) ----
#
# RATE_LIMITER: Workers Rate Limiting, room connections per client IP (CF-Connecting-IP); over the
# limit the upgrade is answered 429. namespace_id is any account-unique integer you pick.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 30, period = 60 }
#
# DENYLIST: a KV namespace. A key "code:ABCDE" refuses that room code, "ip:203.0.113.7" refuses that
# client (any value; reads are edge-cached for 60 s). Create it with
#   npx wrangler kv namespace create DENYLIST
# and block with e.g.  npx wrangler kv key put --binding DENYLIST "code:ABCDE" 1 --remote
# [[kv_namespaces]]
# binding = "DENYLIST"
# id = "<namespace id printed by the create command>"
#
# IP_SALT (secret): salt for the hashed client IPs that cap listed rooms per client in the server
# browser (3), and for the hashed IPs and browser tokens stored with leaderboard entries. Optional;
# set it with  npx wrangler secret put IP_SALT
#
# ADMIN_TOKEN (secret): enables DELETE /leaderboard/<entry id> and DELETE /maps/<map id> (removal
# requests, moderation):
#   npx wrangler secret put ADMIN_TOKEN
#   curl -X DELETE -H "Authorization: Bearer <token>" https://<relay>/leaderboard/123
# Entry ids are in GET /leaderboard?map=<map>&class=<class> (or class=all).

# ---- Local development: npx wrangler dev --env dev   (or: npm run dev) ----
# The same worker, with localhost pages allowed. Durable Object bindings and vars are not inherited
# by environments, so they are repeated here; migrations are.
[env.dev.vars]
ALLOWED_ORIGINS = "http://localhost:*,http://127.0.0.1:*,https://fpv-sim-gamma.vercel.app,app://fpv-sim"

[[env.dev.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.dev.durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[env.dev.durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[[env.dev.durable_objects.bindings]]
name = "MAP_INDEX"
class_name = "MapIndex"

# (wrangler dev keeps R2 objects in a local simulation: no bucket needs to exist for development)
[[env.dev.r2_buckets]]
binding = "USER_MAPS"
bucket_name = "fpv-sim-user-maps-dev"
