# Validates map packages on pull requests that touch them: JSON Schema, structure, budgets,
# licence files, assets, that every map builds, that the community index is up to date, and the
# test suite (which also loads the example and Bando packages).
name: Maps

on:
  pull_request:
    paths:
      - 'public/maps/community/**'
      - 'public/maps/bando/**'
      - 'schemas/**'
      - 'src/maps/**'
      - 'scripts/validate-map.mjs'
      - 'scripts/build-map-index.mjs'
      - '.github/workflows/maps.yml'
  push:
    branches: [main]
    paths:
      - 'public/maps/community/**'
      - 'schemas/**'
      - 'src/maps/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]')) &&
        'ubuntu-latest' ||
        fromJSON(vars.RUNNER_FLEET_LABELS || '["ubuntu-latest"]')
      }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate every community map package
        run: npm run map:validate -- --all
      - name: Validate the built-in package maps
        run: npm run map:validate -- --local public/maps/bando
      - name: Community index is up to date
        run: node scripts/build-map-index.mjs --check
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
