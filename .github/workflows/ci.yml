# Checks every pull request and every push to main: typecheck (app + relay server), tests, the
# generated files are up to date, the production build, and the bundle-size budget.
#
# Note: Vercel deploys main on every push whether or not this passes. Make "CI / build" a required
# status check (branch protection on main) and enable Vercel's "wait for checks" / Deployment Checks
# so a red build never reaches production.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]')) &&
        'ubuntu-latest' ||
        fromJSON(vars.RUNNER_FLEET_LABELS || '["ubuntu-latest"]')
      }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install
        run: npm ci
      - name: Install (relay server, types only)
        run: npm ci --ignore-scripts
        working-directory: server
      - name: Typecheck (app)
        run: npx tsc --noEmit -p .
      - name: Typecheck (relay server)
        run: npx tsc --noEmit -p .
        working-directory: server
      - name: Tests
        run: npm test
      - name: Community map index is up to date
        run: node scripts/build-map-index.mjs --check
      - name: Third-party notices are up to date
        run: node scripts/build-licenses.mjs --check
      - name: Build
        run: npm run build
      - name: Generated files unchanged by the build
        run: git diff --exit-code
      - name: Bundle-size budget (initial JavaScript, gzip)
        run: node scripts/check-bundle-size.mjs --budget-kb 350
